apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: campus-app
  template:
    metadata:
      labels:
        app: campus-app
    spec:
      containers:
      - name: campus-app
        image: DOCKER_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: campus-app-service
spec:
  type: NodePort
  selector:
    app: campus-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
